app = "ifh-poll-demo"
region = "iad"

[service]
internal_port = 3000
# Always-on (no scale-to-zero): one warm machine, no cold starts, and
# in-memory/ephemeral poll data persists between visits (only a redeploy
# resets it). A [[volumes]] mount would make votes durable across redeploys
# too, but attaching a volume currently leaves a Dockerfile-deployed app
# unreachable (edge routing breaks) — see docs/agents/persistence.md.
autostop = false
min_machines = 1

[resources]
cpu_kind = "shared"
cpus = 1
memory_mb = 256
